name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # `cache: npm` is deliberately off — it hard-fails when package-lock.json
          # is missing. Add it back once the lock file is committed.

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "→ lock file found, using npm ci"
            npm ci --no-audit --no-fund
          else
            echo "→ no lock file, using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Drop server-only routes (GitHub Pages has no server)
        run: rm -rf src/app/api

      - name: Build the static export
        run: npx next build
        env:
          EXPORT_STATIC: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # Optional override; the code already defaults to https://chauhan.qd.je
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://chauhan.qd.je' }}

      - name: Attach the custom domain (CNAME)
        if: ${{ vars.PAGES_CNAME != '' }}
        run: echo "${{ vars.PAGES_CNAME }}" > out/CNAME

      - name: Report what was built
        run: |
          echo "out/CNAME -> $(cat out/CNAME 2>/dev/null || echo MISSING)"
          echo "Pages generated: $(find out -name '*.html' | wc -l)"
          find out -name '*.html' | sort | sed 's/^/  /'
          echo "Total size: $(du -sh out | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
